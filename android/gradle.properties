org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Where the app loads the TV UI from. Empty = the web build bundled in assets/www (npm run build:android).
# For development on the Android TV emulator: megatvUrl=http://10.0.2.2:5302/
megatvUrl=
# The answer service. 10.0.2.2 is the host machine as seen from the Android emulator.
# On a Fire TV Stick use your computer's LAN address, or the API Gateway URL once deployed.
megatvApi=http://10.0.2.2:8302
